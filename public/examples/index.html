<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kago</title>
<link rel="canonical" href="https://kago.tools/en/examples/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/site.css">
<script>
var lang = (navigator.languages && navigator.languages[0]) || navigator.language || "";
location.replace(/^ja(-|$)/i.test(lang) ? "https://kago.tools/ja/examples/" : "https://kago.tools/en/examples/");
</script>
</head>
<body>
<main class="choose">
<p><a href="https://kago.tools/en/examples/">English</a></p>
<p><a href="https://kago.tools/ja/examples/" lang="ja">日本語</a></p>
</main>
</body>
</html>
