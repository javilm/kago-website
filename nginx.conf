# nginx.conf - the web server's settings for kago.tools. The Docker
# image installs it as /etc/nginx/conf.d/default.conf (see Dockerfile).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /download moves to /download/. The move names the path only: the
    # reverse proxy in front speaks plain http to this server, so a
    # full address would send the browser to http://kago.tools/.
    absolute_redirect off;

    # A missing address shows the English "page not found" page. So
    # does a directory without a page of its own (/files/), which
    # nginx would otherwise refuse with 403.
    error_page 404 /en/404.html;
    error_page 403 =404 /en/404.html;

    # Under /ja/, the Japanese one.
    location /ja/ {
        error_page 404 /ja/404.html;
        error_page 403 =404 /ja/404.html;
    }
}
